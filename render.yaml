databases:
  # Free Postgres is removed by Render 30 days after creation. Upgrading to
  # basic-256mb before then keeps the data; after then there is nothing to keep.
  - name: oracle-db
    plan: free
    databaseName: oracle
    user: oracle

services:
  - type: web
    name: oracle
    runtime: node
    # Free instances sleep after 15 minutes without inbound HTTP, so the bot runs
    # in webhook mode here — an incoming update is inbound traffic and wakes it.
    # On starter or above, set BOT_MODE=polling: no cold start on the first
    # message, and the outreach sweep actually keeps time.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oracle-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ORACLE_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.ppq.ai/v1
      - key: BOT_MODE
        value: webhook
      # Chats The Oracle will speak in. Empty would allow direct messages from
      # anyone who finds the bot, which is both out of character and unbounded spend.
      - key: ORACLE_CHAT_IDS
        value: "-1004366879517"
      - key: VOICE_MODEL
        value: anthropic/claude-sonnet-4.6
      - key: JUDGE_MODEL
        value: claude-haiku-4.5
      - key: ALLOWED_ORIGINS
        value: ""
      # Fraction of Telegram replies spoken rather than written. Set 0 to disable.
      - key: VOICE_CHANCE
        value: "0.15"
      - key: VOICE_ID
        value: nPczCjzI2devNBz1zQrb
      - key: TTS_MODEL
        value: eleven_flash_v2_5
      - key: SILENCE_MINUTES
        value: "720"
